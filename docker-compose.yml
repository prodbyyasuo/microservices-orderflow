services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: orderflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  catalog-db:
    image: postgres:16-alpine
    container_name: orderflow-catalog-db
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-db:
    image: postgres:16-alpine
    container_name: orderflow-order-db
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20

  payment-db:
    image: postgres:16-alpine
    container_name: orderflow-payment-db
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-db:
    image: postgres:16-alpine
    container_name: orderflow-notification-db
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-service:
    build:
      context: ./catalog-service
    container_name: orderflow-catalog-service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg2://catalog:catalog@catalog-db:5432/catalog
    ports:
      - "8001:8000"
    depends_on:
      catalog-db:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
    container_name: orderflow-order-service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg2://orders:orders@order-db:5432/orders
      CATALOG_SERVICE_URL: http://catalog-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "8002:8000"
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: ./payment-service
    container_name: orderflow-payment-service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+asyncpg://payments:payments@payment-db:5432/payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "8003:8000"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: ./notification-service
    container_name: orderflow-notification-service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg2://notifications:notifications@notification-db:5432/notifications
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "8004:8000"
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
