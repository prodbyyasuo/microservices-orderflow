[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
files = [
    "catalog-service/app",
    "order-service/app",
    "payment-service/app",
    "notification-service/app",
    "auth-service/app",
    "api-gateway/app",
]
python_version = "3.13"
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true
ignore_missing_imports = true
